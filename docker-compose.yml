services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/integrity_iq.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-change-me}
      - GRANITE_BACKEND=${GRANITE_BACKEND:-watsonx}
      - WATSONX_API_KEY=${WATSONX_API_KEY}
      - WATSONX_PROJECT_ID=${WATSONX_PROJECT_ID}
      - WATSONX_URL=${WATSONX_URL:-https://us-south.ml.cloud.ibm.com}
    volumes:
      - api_data:/data
      - vector_store_data:/app/vector_store_data

  dashboard:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api

volumes:
  api_data:
  vector_store_data:
