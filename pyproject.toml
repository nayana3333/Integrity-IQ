[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF", "BLE", "DTZ"]
ignore = [
    "B008",  # function-call-in-default-argument: FastAPI's `Depends(...)` pattern
             # relies on exactly this, project-wide - not a bug here.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # test fixtures sometimes import for side effects / re-export
